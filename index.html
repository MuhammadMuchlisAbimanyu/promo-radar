<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promo Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Pixelify+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Arah: buku catatan nelayan. Latar abu laut, kartu seperti label kotak pancing, aksen pelampung oranye. */
:root {
  --bg: #e9eff0; --panel: #f7fafa; --ink: #12262f; --muted: #51666f; --line: #c6d3d6;
  --accent: #d9481f; --accent-ink: #ffffff; --sea: #1c6f80; --sea-soft: #d5e8ec;
  --ok: #1d7a46; --ok-bg: #d9efe2; --warn: #8a5a00; --warn-bg: #fbecc8; --bad: #a3261f; --bad-bg: #f7dad7;
  --display: "Pixelify Sans", "Courier New", monospace; --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1a21; --panel: #15262f; --ink: #e4eef0; --muted: #98aeb6; --line: #27404b;
  --accent: #f0653a; --accent-ink: #1a0b05; --sea: #6cc0d1; --sea-soft: #1b3944;
  --ok: #6fd39a; --ok-bg: #153626; --warn: #f0c35c; --warn-bg: #3a2d0c; --bad: #ff8a80; --bad-bg: #44201d; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1a21; --panel: #15262f; --ink: #e4eef0; --muted: #98aeb6; --line: #27404b;
  --accent: #f0653a; --accent-ink: #1a0b05; --sea: #6cc0d1; --sea-soft: #1b3944;
  --ok: #6fd39a; --ok-bg: #153626; --warn: #f0c35c; --warn-bg: #3a2d0c; --bad: #ff8a80; --bad-bg: #44201d; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 880px; margin: 0 auto; padding: 16px 16px 96px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 8px 0 14px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand svg { flex: none; }
h1 { font-family: var(--display); font-weight: 600; font-size: 28px; line-height: 1.1; margin: 0; text-wrap: balance; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.picker { display: flex; align-items: center; gap: 8px; }
.picker span { font-size: 13px; color: var(--muted); }
nav#tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; border-bottom: 2px solid var(--line); margin-bottom: 16px; }
.tab { font: inherit; font-weight: 600; font-size: 15px; color: var(--muted); background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 12px; margin-bottom: -8px; cursor: pointer; white-space: nowrap; }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }
.tab:hover { color: var(--ink); }
h2 { font-family: var(--display); font-weight: 500; font-size: 20px; margin: 0 0 8px; }
h3 { margin: 0; font-size: 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 0 0 14px; }
.muted { color: var(--muted); font-size: 14px; margin: 6px 0; }
.row { display: flex; gap: 16px; flex-wrap: wrap; align-items: end; margin-top: 8px; }
.row .field { flex: 1 1 260px; }
.field { display: flex; flex-direction: column; gap: 4px; margin: 0 0 10px; }
.field > span { font-size: 13px; color: var(--muted); font-weight: 600; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0 14px; margin-top: 8px; }
input[type=text], input[type=url], input[type=number], select, textarea {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; min-height: 42px; }
textarea { resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid var(--sea); outline-offset: 2px; }
.check { display: flex; align-items: center; gap: 10px; font-size: 15px; cursor: pointer; padding: 6px 0; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0; }
.chip { font: inherit; font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.chip.on { background: var(--sea); border-color: var(--sea); color: var(--accent-ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip.on { color: #06222b; } }
:root[data-theme="dark"] .chip.on { color: #06222b; }
.chip:hover:not(.on) { border-color: var(--sea); }
.list-head { display: flex; align-items: center; justify-content: space-between; margin: 18px 0 8px; }
.list-head h2 { margin: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--sea); border-radius: 10px; padding: 14px 16px; margin: 0 0 12px; position: relative; }
.card.comm { border-left-color: var(--accent); }
.card.log { border-left-color: var(--line); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.tag { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--sea-soft); color: var(--ink); }
.tag.spec { background: var(--sea-soft); } .tag.gen { background: var(--line); } .tag.own { background: var(--warn-bg); color: var(--warn); }
.tag.used { background: var(--warn-bg); color: var(--warn); } .tag.cnt { background: none; color: var(--muted); padding-left: 0; }
.ttl { font-size: 17px; line-height: 1.3; margin: 0 0 6px; text-wrap: balance; }
.txt { margin: 0 0 10px; white-space: pre-wrap; max-width: 68ch; overflow-wrap: anywhere; }
.card, .note, .muted, .ttl { overflow-wrap: anywhere; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn, .linkbtn { font: inherit; font-weight: 600; font-size: 15px; border-radius: 8px; padding: 9px 14px; min-height: 42px; cursor: pointer; border: 1px solid var(--line); background: var(--bg); color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; }
.btn:hover, .linkbtn:hover { border-color: var(--sea); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.actions select { width: auto; min-width: 150px; }
.note { border-radius: 8px; padding: 10px 14px; margin: 0 0 12px; font-size: 14px; border: 1px solid transparent; }
.note.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.note.bad { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.note.small { margin: 0 0 10px; padding: 6px 10px; }
.status { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.status.ok { background: var(--ok-bg); color: var(--ok); } .status.wait, .status.check { background: var(--warn-bg); color: var(--warn); } .status.no { background: var(--bad-bg); color: var(--bad); }
.stats { display: flex; gap: 12px; flex-wrap: wrap; }
.stat { flex: 1 1 140px; background: var(--bg); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; }
.stat b { font-family: var(--display); font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; }
.checks { list-style: none; margin: 0; padding: 0; }
.kw .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.kw h3 { font-family: var(--display); font-weight: 500; font-size: 18px; }
.rules ol { margin: 0; padding-left: 20px; } .rules li { margin: 4px 0; max-width: 68ch; }
details > summary { cursor: pointer; font-weight: 700; padding: 4px 0; }
.manual-box { margin-top: 10px; } .manual { font-family: ui-monospace, monospace; font-size: 14px; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 10; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
@media (max-width: 480px) { h1 { font-size: 24px; } .actions .btn { flex: 1 1 auto; justify-content: center; } .list-head .btn { flex: none; } .actions select { width: 100%; } }

.qhead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 10px; }
.qcount b { font-family: var(--display); font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; margin-right: 8px; }
.qcount span, .qmeta { color: var(--muted); font-size: 14px; }
.qcard { border-left-color: var(--accent); }
.qcard textarea { font-size: 16px; line-height: 1.5; }
.btn.big { width: 100%; justify-content: center; min-height: 52px; font-size: 17px; margin: 4px 0 6px; }
.empty p { max-width: 60ch; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="var(--sea)"/><circle cx="20" cy="20" r="12" fill="none" stroke="var(--panel)" stroke-width="2"/><circle cx="20" cy="20" r="6" fill="none" stroke="var(--panel)" stroke-width="2"/><circle cx="20" cy="20" r="2.5" fill="var(--accent)"/><path d="M20 20 L31 9" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/></svg>
      <div><h1>Promo Radar</h1><p class="sub">Kamu yang menempel dan menekan kirim. Aplikasi ini nggak memposting apa pun.</p></div>
    </div>
    <label class="picker"><span>Produk</span><select id="prod-select" aria-label="Produk aktif"></select></label>
  </header>
  <div class="note warn" id="store-warn" hidden>Penyimpanan peramban tidak tersedia di tampilan ini. Data hilang saat halaman ditutup; gunakan tab Catatan untuk menyalin cadangan.</div>
  <nav id="tabs" aria-label="Bagian aplikasi"></nav>
  <main id="view"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
// Kalimat promosi. {nama} {jenis} {tagline} {hook} {niche} {link} diisi dari data Produk.
// p = "*" berlaku untuk semua produk; selain itu id produk. kind: post (judul + isi) | reply (satu paragraf)
const CTX = [
  { id: "dev",   name: "Sesama developer",   hint: "Komunitas indie dev, showcase, playtest" },
  { id: "niche", name: "Komunitas peminat",  hint: "Komunitas yang cocok dengan tema produkmu" },
  { id: "sejenis", name: "Komunitas sejenis", hint: "Komunitas produk lain yang mirip. Hanya di kanal pamer karya, atau tanya admin dulu" },
  { id: "reply", name: "Balas postingan orang", hint: "Komentar di postingan yang memang relevan" },
  { id: "short", name: "Komentar video pendek", hint: "TikTok, Reels, Shorts: satu-dua kalimat" },
  { id: "thanks", name: "Balas pemain", hint: "Bilang makasih, minta masukan, tanggapi ulasan" },
  { id: "en",    name: "English", hint: "Reddit, Discord, komentar berbahasa Inggris" }
];

const TPL = [
/* ===== Pixel Fishing: sesama developer ===== */
{ id:"pf-dev-1", p:"pixel-fishing", c:"dev", t:"Bikin game mancing pixel, udah bisa dicoba di Android",
  x:"Aku yang bikin. Mancing santai di dunia pixel, karakternya kucing, dan ikan langka kadang muncul dengan mutasi atau aura. Masih banyak kurangnya, makanya aku cari yang mau nyoba dan jujur bilang mana yang ngebosenin atau bikin bingung.\n\n{link}" },
{ id:"pf-dev-2", p:"pixel-fishing", c:"dev", t:"Kontrol kail di game mancing pixel ini enak atau ribet sih?",
  x:"Aku bikin game mancing 2D gaya pixel. Yang paling bikin aku ragu itu rasa kontrol kailnya, udah pas atau malah ribet buat pemain baru. Kalau ada waktu bentar buat coba, aku pengen denger kesan pertama kalian, yang jelek juga gapapa.\n\n{link}" },
{ id:"pf-dev-3", p:"pixel-fishing", c:"dev", t:"Dari Amanyu Studio: game mancing pixel, minta komentar sesama dev",
  x:"Aku dari Amanyu Studio, studio kecil yang baru mulai. Game ini mancing santai, ikannya dari yang umum sampai mistik. Soal balans sama UI aku masih belajar, jadi komentar dari yang udah lebih lama di sini ngebantu banget.\n\n{link}" },
{ id:"pf-dev-4", p:"pixel-fishing", c:"dev", t:"Teks kepotong di HP kecil, ternyata paling lama ngebenerinnya",
  x:"Di game mancing pixel-ku, yang paling lama kuberesin ternyata teks yang kepotong di layar kecil. Udah kucek di beberapa lebar layar, tapi aku belum bisa mastiin di semua HP. Kalau ada yang nyoba terus nemu yang masih rusak, kabarin ya.\n\n{link}" },
{ id:"pf-dev-5", p:"pixel-fishing", c:"dev", t:"Game mancing pixel (Android), boleh minta feedback?",
  x:"Aku yang bikin. Kalau ada yang mau nyoba lima menit terus kasih kesan, aku seneng banget.\n\n{link}" },
{ id:"pf-dev-6", p:"pixel-fishing", c:"dev", t:"Apa sih yang bikin kalian bosen di game mancing mobile?",
  x:"Lagi ngegarap game mancing pixel dan pengen tau apa yang biasanya bikin kalian berhenti main game sejenis. Punyaku ada ikan bermutasi, akuarium, sama papan peringkat, tapi bisa jadi aku kelewatan yang lebih penting. Kalau mau lihat hasilnya: {link}" },

/* ===== Pixel Fishing: komunitas peminat ===== */
{ id:"pf-niche-1", p:"pixel-fishing", c:"niche", t:"Ada yang suka game mancing santai? Aku bikin versi pixel",
  x:"Nggak ada balapan, nggak ada perang. Cuma lempar kail, nunggu, tarik, terus pajang ikannya di akuarium. Karakternya kucing, musiknya pelan. Aku yang bikin dan lagi cari orang yang mau nyoba.\n\n{link}" },
{ id:"pf-niche-2", p:"pixel-fishing", c:"niche", t:"Game mancing pixel di Android, ini punyaku (jadi ya bias)",
  x:"Jujur aja, aku yang bikin, jadi jangan percaya penuh kalau kubilang bagus. Tapi kalau lagi nyari game mancing yang tenang, dengan ikan bermutasi dan koleksi yang bisa dilengkapi, mungkin cocok. Ada beberapa lokasi mancing, bisa dimainin dalam bahasa Indonesia.\n\n{link}" },
{ id:"pf-niche-3", p:"pixel-fishing", c:"niche", t:"Ikan langka bisa bermutasi dan beraura di game mancing pixel",
  x:"Di game ini ikan yang langka banget kadang muncul dengan mutasi dan aura. Itu bagian yang paling pengen kutunjukin ke orang. Kalau suka ngoleksi, ada indeks ikan yang bisa dilengkapi.\n\n{link}" },
{ id:"pf-niche-4", p:"pixel-fishing", c:"niche", t:"Kucing mancing: game santai buat yang lagi nggak mau tegang",
  x:"Kalau lagi pengen main yang nggak bikin tegang, mungkin ini bisa dicoba. Ada kucing, dermaga kayu, hujan di pelabuhan. Aku yang bikin dan masih terus kuperbaiki.\n\n{link}" },
{ id:"pf-niche-5", p:"pixel-fishing", c:"niche", t:"Bikin game mancing pixel dengan musik laut yang kalem",
  x:"Tempo-nya pelan, musiknya santai, nggak ada yang ngejar-ngejar. Aku yang bikin, jadi kalau ada yang mau nyoba dan bilang suasananya udah pas atau belum, aku dengerin.\n\n{link}" },
{ id:"pf-niche-6", p:"pixel-fishing", c:"niche", t:"Buat yang beneran mancing: game ini kerasa masuk akal nggak?",
  x:"Sebagai pembuatnya aku penasaran sama pendapat orang yang beneran mancing. Suasana sama ritmenya kerasa wajar, atau malah aneh? Gamenya ringan, gaya pixel.\n\n{link}" },
{ id:"pf-niche-7", p:"pixel-fishing", c:"niche", t:"Buat yang lagi nggak bisa ke laut atau empang",
  x:"Kalau lagi hujan atau lagi sibuk dan nggak bisa mancing, mungkin game kecil ini bisa jadi pengganti sebentar. Aku yang bikin, bisa dicoba di Android.\n\n{link}" },

/* ===== Pixel Fishing: komunitas sejenis ===== */
{ id:"pf-sj-1", p:"pixel-fishing", c:"sejenis", t:"",
  x:"Mau nanya dulu ke admin, boleh nggak share game mancing buatanku di sini? Kalau nggak boleh ya nggak apa-apa." },
{ id:"pf-sj-2", p:"pixel-fishing", c:"sejenis", t:"",
  x:"Aku bikin game mancing pixel di Android. Kalau ada kanal buat karya member, aku taruh di sini ya, hapus aja kalau nggak boleh. {link}" },
{ id:"pf-sj-3", p:"pixel-fishing", c:"sejenis", t:"",
  x:"Sama-sama suka mancing virtual nih. Punyaku gaya pixel, ikannya bisa bermutasi, karakternya kucing. Boleh dicoba kalau mau. {link}" },
{ id:"pf-sj-4", p:"pixel-fishing", c:"sejenis", t:"",
  x:"Lagi bosen sama grind yang gitu-gitu aja? Ada game mancing pixel yang lebih pelan di Android, buatanku. {link}" },
{ id:"pf-sj-5", p:"pixel-fishing", c:"sejenis", t:"",
  x:"Ada developer indie di sini? Aku punya game mancing pixel dan mau minta pendapat. {link}" },

/* ===== Pixel Fishing: balas postingan orang ===== */
{ id:"pf-re-1", p:"pixel-fishing", c:"reply", t:"",
  x:"Kalau kamu suka game mancing santai, aku lagi bikin yang gaya pixel. Aku yang bikin sih, jadi ya bias dikit, tapi kalau mau coba: {link}" },
{ id:"pf-re-2", p:"pixel-fishing", c:"reply", t:"",
  x:"Nyambung sama yang kamu bilang. Game mancing buatanku juga ke arah situ, santai dan nggak buru-buru. Kalau tertarik: {link}" },
{ id:"pf-re-3", p:"pixel-fishing", c:"reply", t:"",
  x:"Aku juga lagi ngegarap yang mirip (pixel, kucing, mancing). Kalau sempat, boleh kasih masukan: {link}" },
{ id:"pf-re-4", p:"pixel-fishing", c:"reply", t:"",
  x:"Numpang info ya, aku bikin game mancing pixel di Android. Siapa tau cocok sama yang kamu cari: {link}" },
{ id:"pf-re-5", p:"pixel-fishing", c:"reply", t:"",
  x:"Ide menarik. Aku sendiri lagi ngegarap game mancing pixel, mungkin bisa buat pembanding: {link}" },
{ id:"pf-re-6", p:"pixel-fishing", c:"reply", t:"",
  x:"Kalau nyari game mancing yang ringan buat HP, ada punyaku. Aku yang bikin, jadi jujur aja ya: {link}" },

/* ===== Pixel Fishing: komentar video pendek ===== */
{ id:"pf-sh-1", p:"pixel-fishing", c:"short", t:"", x:"Jadi pengen mancing. Aku bikin game mancing pixel kalau mau lihat: {link}" },
{ id:"pf-sh-2", p:"pixel-fishing", c:"short", t:"", x:"Vibes-nya mirip game mancing pixel buatanku, mampir ya {link}" },
{ id:"pf-sh-3", p:"pixel-fishing", c:"short", t:"", x:"Aku yang bikin game mancing pixel di Android, boleh dicoba {link}" },
{ id:"pf-sh-4", p:"pixel-fishing", c:"short", t:"", x:"Kucingnya lucu! Punyaku juga ada kucing mancing {link}" },
{ id:"pf-sh-5", p:"pixel-fishing", c:"short", t:"", x:"Mancing virtual, tapi pixel: {link}" },
{ id:"pf-sh-6", p:"pixel-fishing", c:"short", t:"", x:"Kalau suka konten begini, ada game mancing santai buatanku {link}" },

/* ===== Pixel Fishing: balas pemain ===== */
{ id:"pf-th-1", p:"pixel-fishing", c:"thanks", t:"",
  x:"Makasih udah mau nyoba! Kalau ada yang bikin bingung atau ada bug, tulis di sini atau lewat Pengaturan > Lapor Masalah di dalam game." },
{ id:"pf-th-2", p:"pixel-fishing", c:"thanks", t:"",
  x:"Makasih masukannya, kucatat. Bagian itu emang masih kasar." },
{ id:"pf-th-3", p:"pixel-fishing", c:"thanks", t:"",
  x:"Dapat ikan bermutasi? Selamat! Cerita dong dapat ikan apa, aku penasaran." },
{ id:"pf-th-4", p:"pixel-fishing", c:"thanks", t:"",
  x:"Makasih ulasannya, udah kubaca. Aku lanjut benerin berdasarkan masukan kalian." },
{ id:"pf-th-5", p:"pixel-fishing", c:"thanks", t:"",
  x:"Kalau ada ikan atau mutasi yang menurutmu kegampangan atau kesusahan didapat, kabarin ya. Balansnya masih kuatur." },

/* ===== Pixel Fishing: English ===== */
{ id:"pf-en-1", p:"pixel-fishing", c:"en", t:"I made a cozy pixel fishing game for Android and I'd like honest feedback",
  x:"I'm the developer. It's a slow, relaxed fishing game: you play as a cat, catch fish from common to mythic, and the rare ones can show up with mutations and auras. It's available in English and Indonesian. I'm mostly curious what feels confusing in the first ten minutes.\n\n{link}" },
{ id:"pf-en-2", p:"pixel-fishing", c:"en", t:"Pixel fishing game with a cat: what would make you keep playing?",
  x:"Developer here. I'm trying to understand what keeps people coming back to a relaxed fishing game. Mine has an aquarium, a fish index, daily quests and a leaderboard, but I'm not sure that's the right mix. Link if you want to look: {link}" },
{ id:"pf-en-3", p:"pixel-fishing", c:"en", t:"A wooden pier, rain, and a cat with a fishing rod (Android)",
  x:"I built this and I'm looking for people who like quiet games to try it and tell me what feels off. {link}" },
{ id:"pf-en-4", p:"pixel-fishing", c:"en", t:"",
  x:"I make a small pixel fishing game, so I'm biased, but if you like this kind of thing: {link}" },
{ id:"pf-en-5", p:"pixel-fishing", c:"en", t:"",
  x:"Dev disclosure: this one is mine. Cozy pixel fishing, a few fishing spots, rare fish with mutations. Happy to hear what's rough. {link}" },
{ id:"pf-en-6", p:"pixel-fishing", c:"en", t:"What do you want from a mobile fishing game that most of them don't do?",
  x:"Genuinely asking, I'm building one and want to know what to prioritise. For context, mine is here: {link}" },
